<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0d0f1a"/>
  
  <!-- speed lines behind envelope -->
  <line x1="18" y1="118" x2="72" y2="118" stroke="#5865f2" stroke-width="6" stroke-linecap="round"/>
  <line x1="12" y1="140" x2="60" y2="140" stroke="#5865f2" stroke-width="5" stroke-linecap="round"/>
  <line x1="22" y1="162" x2="66" y2="162" stroke="#5865f2" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="184" x2="58" y2="184" stroke="#e8e6f0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  
  <!-- envelope body - angular, thick outline -->
  <polygon points="52,96 152,86 148,190 48,200" fill="#e8e6f0" stroke="#0d0f1a" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- envelope flap lines (X pattern) -->
  <polyline points="52,96 100,148 48,200" fill="none" stroke="#0d0f1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="152,86 100,148 148,190" fill="none" stroke="#0d0f1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- envelope accent stripe -->
  <polygon points="52,96 152,86 148,110 48,120" fill="#ff4d6d" stroke="#0d0f1a" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- paper plane dart bursting forward, angled up-right -->
  <g transform="translate(128, 40) rotate(-22)">
    <!-- main dart body -->
    <polygon points="0,52 88,0 62,64" fill="#5865f2" stroke="#0d0f1a" stroke-width="5" stroke-linejoin="round"/>
    <!-- lower wing -->
    <polygon points="62,64 88,0 98,54" fill="#ff4d6d" stroke="#0d0f1a" stroke-width="5" stroke-linejoin="round"/>
    <!-- center fold highlight -->
    <polyline points="0,52 62,64 88,0" fill="none" stroke="#0d0f1a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- motion trail lines -->
    <line x1="-14" y1="56" x2="-4" y2="54" stroke="#e8e6f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="42" x2="-8" y2="46" stroke="#e8e6f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="68" x2="-2" y2="62" stroke="#e8e6f0" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- burst impact stars near tip -->
  <g stroke="#ff4d6d" stroke-width="4" stroke-linecap="round">
    <line x1="218" y1="38" x2="226" y2="30"/>
    <line x1="228" y1="52" x2="238" y2="50"/>
    <line x1="224" y1="66" x2="234" y2="72"/>
  </g>
  <circle cx="216" cy="46" r="4" fill="#e8e6f0"/>
  
  <!-- small wordmark bottom -->
  <text x="128" y="240" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="3" fill="#5865f2">DM BLASTER</text>
</svg>
